listener:
  http:
    port: 8088
  timeouts:
    read: 30s
    write: 30s
    idle: 60s
  # Per real TCP peer; 0 disables. Do not use this to infer clients behind a LB.
  max_connections_per_ip: 0

routes:
  - name: orders-route
    match:
      path: /api/orders
      methods: [GET, POST]
    backend: orders-backend
    middleware: [orders-rate-limit]

backends:
  - name: orders-backend
    strategy: round_robin
    health_check:
      interval: 10s
      timeout: 2s
      path: /health
    instances:
      - url: http://localhost:8080

middleware:
  - name: orders-rate-limit
    type: rate_limit
    config:
      strategy: sliding_window
      limit: 100
      window: 1m
      by: ip
      store: memory
      # Bound per-process cardinality; idle TTL must be >= window.
      memory_max_buckets: 100000
      memory_bucket_ttl: 5m
      memory_cleanup_interval: 1m

observability:
  logs:
    level: info
  fabric:
    enabled: false
    service_name: relay-edge
    queue_size: 2048

reload:
  watch: false
  debounce: 500ms
