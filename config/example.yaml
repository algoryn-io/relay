listener:
  http:
    port: 8088
  timeouts:
    read: 30s
    write: 30s
    idle: 60s
  # Per real TCP peer; 0 disables. Do not use this to infer clients behind a LB.
  max_connections_per_ip: 0
  health:
    # Public probes return only constant/opaque status by default. Optionally
    # restrict access by immediate TCP peer and/or a bearer token:
    # access:
    #   allowed_cidrs: [10.42.0.0/16]
    #   token_env: RELAY_HEALTH_TOKEN
    readiness:
      # any (default), all, or critical with critical_backends.
      mode: any

routes:
  - name: orders-route
    match:
      path: /api/orders
      methods: [GET, POST]
    backend: orders-backend
    middleware: [browser-security, orders-rate-limit]

backends:
  - name: orders-backend
    strategy: round_robin
    health_check:
      interval: 10s
      timeout: 2s
      path: /health
      method: GET
      expected_status:
        range: [200, 299]
      headers:
        X-Relay-Probe: readiness
    outlier_detection:
      window: 30s
      consecutive_failures: 5
      failure_rate_percent: 50
      minimum_volume: 20
      base_ejection_duration: 30s
      max_ejection_duration: 5m
      max_ejection_percent: 50
      success_recovery: true
    instances:
      - url: http://localhost:8080

middleware:
  - name: browser-security
    type: security_headers
    config:
      preset: secure
      # This example is HTTP-only. Enable HSTS after configuring HTTPS.
      strict_transport_security: off

  - name: orders-rate-limit
    type: rate_limit
    config:
      strategy: sliding_window
      limit: 100
      window: 1m
      by: ip
      store: memory
      # Bound per-process cardinality; idle TTL must be >= window.
      memory_max_buckets: 100000
      memory_bucket_ttl: 5m
      memory_cleanup_interval: 1m

  # Remote RS256 always binds tokens to both issuer and audience:
  # - name: jwt-remote
  #   type: jwt
  #   config:
  #     algorithm: rs256
  #     jwks_url: https://issuer.example.com/.well-known/jwks.json
  #     jwks_cache_ttl: 5m
  #     # Default 0: removed keys are rejected immediately after refresh.
  #     # Opt in only to trade revocation speed for outage availability (max 24h).
  #     jwks_stale_grace: 0s
  #     issuer: https://issuer.example.com
  #     audience: relay-api
  #
  # Prefer key_header for API keys. Legacy query-string keys can leak through
  # logs, caches, and referrers, and therefore require an explicit acknowledgement:
  # - name: legacy-query-api-key
  #   type: api_key
  #   config:
  #     key_query: api_key
  #     acknowledge_api_key_in_query: true
  #     keys_env: RELAY_API_KEYS
  #
  # ext_authz fail-open bypasses authorization during authorizer failures:
  # - name: availability-first-authz
  #   type: ext_authz
  #   config:
  #     authz_url: https://authz.internal.example/check
  #     fail_open: true
  #     acknowledge_ext_authz_fail_open: true

observability:
  logs:
    level: info
  fabric:
    enabled: false
    service_name: relay-edge
    queue_size: 2048

reload:
  watch: false
  debounce: 500ms
