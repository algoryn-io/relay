listener:
  http:
    port: 8088
  timeouts:
    read: 30s
    write: 30s
    idle: 60s

routes:
  - name: orders-route
    match:
      path: /api/orders
      methods: [GET, POST]
    backend: orders-backend

backends:
  - name: orders-backend
    strategy: round_robin
    health_check:
      interval: 10s
      timeout: 2s
      path: /health
    instances:
      - url: http://localhost:8080

middleware: []

observability:
  logs:
    level: info
  fabric:
    enabled: false
    service_name: relay-edge
    queue_size: 2048

reload:
  watch: false
  debounce: 500ms
