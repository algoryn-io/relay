name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  GOVULNCHECK_VERSION: v1.1.4
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'The following Go files are not gofmt-formatted:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Validate example configurations
        run: |
          for config in config/example.yaml config/examples/*.yaml; do
            [ -e "$config" ] || continue
            go run ./cmd/relay -config "$config" -validate
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          $(go env GOPATH)/bin/govulncheck ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
      - run: cd dashboard && npm ci && npm run build
      - run: go build ./cmd/relay

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
      - name: Install golangci-lint with current Go toolchain
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
      # Short fuzzing pass per target to catch panics/crashers on the parser and
      # the route matcher. The seed corpus also runs in the `test` job.
      - name: Fuzz config parser
        run: go test ./internal/config -run '^$' -fuzz='^FuzzLoad$' -fuzztime=60s
      - name: Fuzz route matcher
        run: go test ./internal/router -run '^$' -fuzz='^FuzzMatch$' -fuzztime=60s
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
      # Guard: benchmarks must compile and run. Not a strict perf gate (CI runners
      # are noisy); use `benchstat` locally to compare against main.
      - name: Run benchmarks
        run: go test -run '^$' -bench '^Benchmark' -benchmem ./internal/router/... ./internal/config/...
