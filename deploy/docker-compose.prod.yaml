# Production-oriented Docker Compose for running Relay from the published image.
# Unlike the repo-root docker-compose.yml (which builds from source for local dev),
# this pulls a pinned release image and mounts your own config.
#
#   RELAY_VERSION=0.1.0 docker compose -f deploy/docker-compose.prod.yaml up -d
#
# Provide secrets via an .env file next to this compose file (e.g. JWT_SECRET=...).

services:
  relay:
    # Require an explicit, reviewed release. Do not silently deploy a mutable
    # `latest` tag in production.
    image: algoryn/relay:${RELAY_VERSION:?set RELAY_VERSION to a release tag}
    restart: unless-stopped
    ports:
      - "80:8088"
      - "443:8443"
    environment:
      RELAY_CONFIG: /etc/relay/relay.yaml
    env_file:
      - .env
    volumes:
      # Your Relay config (read-only). Point RELAY_CONFIG at it.
      - ./relay.yaml:/etc/relay/relay.yaml:ro
      # TLS material and/or ACME cache, if you terminate TLS in Relay.
      - relay-tls:/etc/relay/tls
    # The image already ships a HEALTHCHECK against /_relay/health.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  relay-tls:
