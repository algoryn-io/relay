# Default values for the Relay chart.
# This is a YAML-formatted file. Override with --set or a custom values file.

# Number of Relay replicas. Keep listener.https.tls.replicas in the Relay config
# aligned with this value. Automatic TLS with more than one replica requires
# distributed: true and acme_cache.backend: redis; Relay rejects an unsafe
# multi-replica filesystem cache. Supply its URL through existingSecret,
# extraEnv, or a read-only Secret volume plus redis_url_file.
replicaCount: 1

image:
  repository: algoryn/relay
  # Overrides the image tag. Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The Relay configuration. Rendered into a ConfigMap and mounted at
# /etc/relay/relay.yaml (RELAY_CONFIG). Set existingConfigMap to use your own
# ConfigMap instead (it must contain a relay.yaml key).
existingConfigMap: ""
config: |
  listener:
    http:
      port: 8088
    timeouts:
      read: 30s
      write: 30s
      idle: 60s
      read_header: 10s
    # Global overload backpressure (0 = unlimited).
    max_concurrent_requests: 0
    # Per real TCP peer (0 = disabled). Behind a load balancer prefer the
    # global/per-request limits; forwarded headers are not used at ConnState.
    max_connections_per_ip: 0

  observability:
    logs:
      level: info
      format: json
    prometheus:
      # Required for a ServiceMonitor / in-cluster Prometheus to scrape metrics:
      # the endpoints are loopback-only unless a scrape CIDR is allowed here.
      # Set this to your cluster's pod CIDR (or the Prometheus pod's CIDR).
      allowed_cidrs: []

  routes:
    - name: example
      match:
        path_prefix: /
        methods: [GET, POST]
      backend: example-backend
      middleware: [example-rate-limit]

  backends:
    - name: example-backend
      strategy: round_robin
      instances:
        - url: http://example-upstream:8080

  middleware:
    - name: example-rate-limit
      type: rate_limit
      config:
        strategy: sliding_window
        limit: 100
        window: 1m
        by: ip
        store: memory
        # Per-pod cap. Use Redis above when replicas need a shared limit.
        memory_max_buckets: 100000
        memory_bucket_ttl: 5m
        memory_cleanup_interval: 1m

# Secrets injected as environment variables (e.g. JWT_SECRET referenced by a
# middleware's secret_env). Rendered into a Secret and exposed via envFrom.
# Prefer file-based secrets (extraVolumes + *_file config) for stronger isolation,
# including listener.https.tls.acme_cache.redis_url_file.
secrets: {}
# secrets:
#   JWT_SECRET: "change-me"

# Reference an existing Secret via envFrom instead of (or in addition to) secrets.
existingSecret: ""

# Optional Kubernetes Secret containing inbound TLS certificates, private keys,
# and client CA bundles. The whole Secret is mounted read-only at mountPath.
# Relay's file watcher reloads changed Secret projections transactionally.
tls:
  existingSecret: ""
  mountPath: /etc/relay/tls

# Extra environment variables and sources.
extraEnv: []
extraEnvFrom: []

# Extra volumes / mounts — useful for mounting a Kubernetes Secret as files and
# pointing Relay at them with the *_file config options (secret_file, etc.).
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  httpPort: 8088
  httpsPort: 8443
  # Expose the HTTPS port on the Service (only when TLS is configured in config).
  httpsEnabled: false
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod-level security context. Relay's image runs as uid 10001 (non-root).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Container-level security context. The image config lives in /etc/relay and the
# binary writes nothing to the root filesystem, so it can run read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

# Liveness and readiness probes hit Relay's built-in endpoints.
livenessProbe:
  httpGet:
    path: /_relay/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /_relay/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs. The metrics endpoints are loopback-
    # only by default: set observability.prometheus.allowed_cidrs in `config` to
    # your pod CIDR so the scraper is permitted.
    enabled: false
    path: /_relay/metrics/prometheus
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    # Ship Relay's alerting rules as a PrometheusRule (requires the Prometheus
    # Operator). The rule set is deploy/helm/relay/files/prometheus-rules.yaml.
    enabled: false
    additionalLabels: {}
  dashboards:
    # Ship the Grafana dashboard as a ConfigMap for the Grafana sidecar to import.
    enabled: false
    # Label (and value) the Grafana sidecar watches for dashboard auto-discovery.
    label: grafana_dashboard
    labelValue: "1"
    annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
